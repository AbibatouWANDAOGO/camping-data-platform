# Contrat de données au format ODCS (Open Data Contract Standard) v3 : dp_taxe_sejour
# Validé avec le schéma JSON officiel ODCS (bitol-io/open-data-contract-standard, v3.0.2 et v3.1.0).
apiVersion: v3.0.2
kind: DataContract
id: urn:datacontract:les-pins-d-argent:dp_taxe_sejour
name: dp_taxe_sejour
version: 1.0.0
status: draft
domain: facturation-et-taxe
dataProduct: dp_taxe_sejour
tenant: les-pins-d-argent
description:
  purpose: Répondre à la question « Combien dois-je reverser à la commune pour août ? ».
  limitations: Seuls les adultes comptent ; une nuit est comptée dans le mois de la nuit ; tarif fictif de 0,60
    € par adulte et par nuit.
  usage: Base de la déclaration mensuelle de la taxe de séjour par commune.
team:
- username: comptabilite
  role: owner
- username: equipe-data
  role: producer
schema:
- name: dp_taxe_sejour
  physicalName: camping.gold.dp_taxe_sejour
  physicalType: table
  description: 'Data product comptable : base de la taxe de séjour. Grain : une commune x un mois'
  properties:
  - name: commune
    logicalType: string
    physicalType: STRING
    description: Commune à qui la taxe est reversée
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    classification: public
  - name: mois
    logicalType: date
    physicalType: DATE
    description: Premier jour du mois
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    classification: public
  - name: nuitees_adultes
    logicalType: integer
    physicalType: INT
    description: Nuitées d'adultes (mineurs exonérés)
    required: true
    classification: public
  - name: tarif_adulte_nuit
    logicalType: number
    physicalType: DECIMAL(5,2)
    description: Tarif de la taxe par adulte et par nuit
    required: true
    classification: public
  - name: montant_a_reverser
    logicalType: number
    physicalType: DECIMAL(12,2)
    description: nuitees_adultes x tarif
    required: true
    classification: public
  quality:
  - type: sql
    description: Règle montant_coherent
    query: SELECT COUNT(*) FROM ${object} WHERE montant_a_reverser <> nuitees_adultes * tarif_adulte_nuit
    mustBe: 0
    dimension: accuracy
  - type: sql
    description: Règle grain_unique
    query: SELECT COUNT(*) FROM (SELECT commune, mois FROM ${object} GROUP BY 1, 2 HAVING COUNT(*) > 1)
    mustBe: 0
    dimension: uniqueness
slaProperties:
- property: frequency
  value: 1
  unit: d
  description: Mise à jour chaque nuit
- property: timeOfAvailability
  value: 06:00
  description: Heure à laquelle les chiffres de la veille sont disponibles
roles:
- role: lecteur_comptabilite
  access: read
  description: Lecture du data product par comptabilite
customProperties:
- property: donnees_personnelles
  value: 'non : agrégats, aucune colonne taguée dcp'
- property: catalogue_unity
  value: camping.gold.dp_taxe_sejour
